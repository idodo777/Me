name: "声明式改写探针"
description: "脚本诊断"
author: "idodo777"
homepage: "https://github.com/idodo777/Me"

url_rewrites:
  - match: "^https://example\\.com/$"
    location: "https://www.iana.org/help/example-domains"
    status_code: 302

body_rewrites:
  - response_jq:
      match: "^https://api\\.github\\.com/$"
      filter: ".current_user_url = \"EGERN-JQ-APPLIED\""

mitm:
  hostnames:
    - "example.com"
    - "api.github.com"
