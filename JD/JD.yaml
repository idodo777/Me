name: "京东去广告"
description: "京东去广告"
author: "idodo777"
homepage: "https://github.com/idodo777/Me"

rules:
  - and:
      match:
        - domain_suffix:
            match: "jd.com"
        - protocol:
            match: "quic"
      policy: "REJECT"
  - and:
      match:
        - domain_suffix:
            match: "jd.com"
        - protocol:
            match: "udp"
        - dest_port:
            match: "443"
      policy: "REJECT"
  - domain:
      match: "dns.jd.com"
      policy: "REJECT"
  - ip_cidr:
      match: "101.124.19.122/32"
      policy: "REJECT"
      no_resolve: true
  - ip_cidr6:
      match: "2402:db40:5100:1011::5/128"
      policy: "REJECT"
      no_resolve: true
  - url_regex:
      match: "functionId=welcomeHome"
      policy: "REJECT"
  - url_regex:
      match: "functionId=readCustomSurfaceList"
      policy: "REJECT"
  - url_regex:
      match: "functionId=cornerCarousel"
      policy: "REJECT"
  - url_regex:
      match: "functionId=queryPagePopWindow"
      policy: "REJECT"
  - url_regex:
      match: "functionId=getBubbleInfo"
      policy: "REJECT"
  - url_regex:
      match: "functionId=xview2Config"
      policy: "REJECT"
  - url_regex:
      match: "functionId=uniformRecommend9c"
      policy: "REJECT"
  - url_regex:
      match: "functionId=publicThirdAddress"
      policy: "REJECT"
  - url_regex:
      match: "functionId=(searchBoxWord|stationPullService|uniformRecommend[06])"
      policy: "REJECT"
  - url_regex:
      match: "m\\.360buyimg\\.com/mobilecms/s1125x2436_jfs"
      policy: "REJECT"

mitm:
  hostnames:
    - "api.m.jd.com"
    - "in.m.jd.com"
    - "m.360buyimg.com"
