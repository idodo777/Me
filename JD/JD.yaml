name: "京东去广告"
description: "京东去广告"
author: "idodo777"
homepage: "https://github.com/idodo777/Me"

rules:
  - domain:
      match: "dns.jd.com"
      policy: "REJECT"
  - ip_cidr:
      match: "101.124.19.122/32"
      policy: "REJECT"
      no_resolve: true
  - ip_cidr6:
      match: "2402:db40:5100:1011::5/128"
      policy: "REJECT"
      no_resolve: true

url_rewrites:
  - match: "^http://\\w{32}\\.jddebug\\.com/diagnose\\?"
    location: "http://reject/"
  - match: "^https://api\\.m\\.jd\\.com/client\\.action\\?functionId=(searchBoxWord|stationPullService|uniformRecommend[06])"
    location: "http://reject-dict/"
  - match: "^https?://m\\.360buyimg\\.com/mobilecms/s1125x2436_jfs"
    location: "http://reject-200/"

body_rewrites:
  - response_jq:
      match: "^https://api\\.m\\.jd\\.com/client\\.action\\?functionId=basicConfig"
      filter: "if .data.JDMessage.socketmonitor then .data.JDMessage.socketmonitor |= (.isSocketEstablishedAhead = 0 | .isSocketReport = 0) else . end | if .data.JDHttpToolKit.httpdns then .data.JDHttpToolKit.httpdns |= (.httpdns = 0) else . end"

scriptings:
  - http_response:
      name: "京东去广告"
      match: "^https://api\\.m\\.jd\\.com/client\\.action\\?functionId=(deliverLayer|getTabHomeInfo|myOrderInfo|orderTrackBusiness|personinfoBusiness|readCustomSurfaceList|start|welcomeHome)"
      script_url: "https://raw.githubusercontent.com/idodo777/Me/main/JD/JD_remove_ads.js?v=3"
      body_required: true
      timeout: 20
  - http_response:
      name: "京东比价"
      match: "^https?://in\\.m\\.jd\\.com/product/graphext/\\d+\\.html"
      script_url: "https://raw.githubusercontent.com/idodo777/Me/main/JD/JD_Price.js"
      body_required: true
      timeout: 30

mitm:
  hostnames:
    - "api.m.jd.com"
    - "in.m.jd.com"
    - "m.360buyimg.com"
