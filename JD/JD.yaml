name: 京东去广告
description: 京东去广告
author: FFDNS · zbsdsb · huangkouping
homepage: https://github.com/idodo777/Me/tree/main/JD
rules:
- url_regex:
    match: '^http://\w{32}\.jddebug\.com/diagnose\?'
    policy: REJECT
- domain:
    match: dns.jd.com
    policy: REJECT
- domain:
    match: dlog.jd.com
    policy: REJECT
- domain:
    match: dsp-x.jd.com
    policy: REJECT
- domain:
    match: bdsp-x.jd.com
    policy: REJECT
- domain:
    match: kepler.jd.com
    policy: REJECT
- domain:
    match: janapi.jd.com
    policy: REJECT
url_rewrites:
  - match: "^https?://api\\.m\\.jd\\.com/client\\.action\\?functionId=queryMaterialAdverts"
    location: "http://reject-dict/"
  - match: "^https://api\\.m\\.jd\\.com/client\\.action\\?functionId=(?:cartCouponRecommendGoods|intelligentRecommendSku|obtainGrowingInfo|recommendShop|searchBoxWord|stationPullService|uniformRecommend)"
    location: "http://reject-dict/"
  - match: "^https?://api\\.m\\.jd\\.com/\\?loginType=11"
    location: "http://reject-dict/"
  - match: "^https?://api\\.m\\.jd\\.com/client\\.action\\?functionId=getWidgetV1052"
    location: "http://reject/"
  - match: "^https?://m\\.360buyimg\\.com/mobilecms/s1125x2436_jfs"
    location: "http://reject-200/"
body_rewrites:
  - response_jq:
      match: "^https://api\\.m\\.jd\\.com/client\\.action\\?functionId=basicConfig"
      filter: "if .data.JDMessage.socketmonitor then .data.JDMessage.socketmonitor |= (.isSocketEstablishedAhead = 0 | .isSocketReport = 0) else . end | if .data.JDHttpToolKit.httpdns then .data.JDHttpToolKit.httpdns |= (.httpdns = 0) else . end"
  - response_jq:
      match: "^https?://api\\.m\\.jd\\.com/client\\.action\\?functionId=start"
      filter: ". as $o | try ((if (.images|type)==\"array\" then .images=[] else . end) | (if (.showTimesDaily|type)==\"number\" then .showTimesDaily=0 else . end)) catch $o"
  - response_jq:
      match: "^https?://api\\.m\\.jd\\.com/client\\.action\\?functionId=deliverLayer"
      filter: ". as $o | try ((del(.bannerInfo)) | (if (.floors|type)==\"array\" then .floors |= map(select(.mId as $m | $m == null or ([\"banner\",\"jdDeliveryBanner\"] | index($m) | not))) else . end)) catch $o"
  - response_jq:
      match: "^https?://api\\.m\\.jd\\.com/client\\.action\\?functionId=cart"
      filter: ". as $o | try (del(.cartLocationMap.loc_emptyCartFloor2, .emptyCartRecommendFloor)) catch $o"
  - response_regex:
      match: "^https?://api\\.m\\.jd\\.com/client\\.action\\?functionId=lite_advertising"
      find: "jdLiteAdvertisingVO"
      replace: "sooyaaabo"
scriptings:
- http_response:
    name: 京东楼层清洗
    match: '^https?://api\.m\.jd\.(com|hk)/client\.action\?(?:[^&]+&)*functionId=(?:welcomeHome|homePage|myOrderInfo|myDeliveryInfo|personInfoBusiness|getPersonalHome)(?:&|$)'
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/JD/jd-adblock.js?v=1
    body_required: true
    timeout: 10
mitm:
  hostnames:
    - api.m.jd.com
    - api.m.jd.hk
    - m.360buyimg.com
