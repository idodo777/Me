# Talkatone 分流 + 去广告（Egern 版）
# 转自 eslco/base 的 Surge 模块 Talkatone_Opt.sgmodule（作者 eslco，规则来源 LOWERTOP），已按 Egern 格式转换
# 原模块说明：仅适用于登录 Talkatone 后使用，不适用于注册
name: "Talkatone"
description: "Talkatone分流去广告"
author: "eslco / LOWERTOP"
compat_arguments:
  PROXY_POLICY: "PROXY"
compat_arguments_schema:
  PROXY_POLICY:
    name: "代理策略"
    description: "Talkatone 域名与 IP 走代理时用的策略或策略组名，按你自己配置里的名字改"
    default_value: "PROXY"

rules:
  - domain_keyword: {match: "googleads", policy: "REJECT"}
  - domain_suffix: {match: "googleads.g.doubleclick.net", policy: "REJECT"}
  - domain_suffix: {match: "googleads.g.doubleclick-cn.net", policy: "REJECT"}
  - domain_suffix: {match: "lh3.googleadsserving.cn", policy: "REJECT"}
  - domain_suffix: {match: "pagead2.googlesyndication-cn.com", policy: "REJECT"}
  - domain_suffix: {match: "pubmatic.com", policy: "REJECT"}
  - domain_suffix: {match: "smaato.net", policy: "REJECT"}
  - domain_suffix: {match: "criteo.com", policy: "REJECT"}
  - domain_suffix: {match: "au.w.inmobi.com", policy: "REJECT"}
  - domain_suffix: {match: "talkatone.com", policy: "{{{PROXY_POLICY}}}"}
  - domain_suffix: {match: "agkn.com", policy: "{{{PROXY_POLICY}}}"}
  - domain_suffix: {match: "tenor.com", policy: "{{{PROXY_POLICY}}}"}
  - domain_suffix: {match: "tktn.at", policy: "{{{PROXY_POLICY}}}"}
  - domain_suffix: {match: "tktn.be", policy: "{{{PROXY_POLICY}}}"}
  - domain_suffix: {match: "inner-active.mobi", policy: "DIRECT"}
  - domain_suffix: {match: "crashlytics.com", policy: "DIRECT"}
  - domain_suffix: {match: "mobilefuse.com", policy: "DIRECT"}
  - domain_suffix: {match: "inmobi.com", policy: "DIRECT"}
  - domain_suffix: {match: "kochava.com", policy: "DIRECT"}
  - ip_cidr: {match: "216.172.154.0/24", policy: "{{{PROXY_POLICY}}}", no_resolve: true}
  - ip_cidr: {match: "23.19.73.39/32", policy: "{{{PROXY_POLICY}}}", no_resolve: true}
  - ip_cidr: {match: "34.120.13.18/32", policy: "{{{PROXY_POLICY}}}", no_resolve: true}
  - ip_cidr: {match: "23.253.145.244/32", policy: "{{{PROXY_POLICY}}}", no_resolve: true}
  - ip_cidr: {match: "23.235.228.136/29", policy: "{{{PROXY_POLICY}}}", no_resolve: true}
  - ip_cidr: {match: "72.18.158.120/29", policy: "{{{PROXY_POLICY}}}", no_resolve: true}
  - ip_cidr: {match: "205.164.56.0/24", policy: "DIRECT", no_resolve: true}
  - ip_cidr: {match: "50.117.27.0/24", policy: "DIRECT", no_resolve: true}
  - ip_cidr: {match: "63.251.124.0/24", policy: "DIRECT", no_resolve: true}
  - ip_cidr: {match: "69.46.75.0/24", policy: "DIRECT", no_resolve: true}

url_rewrites:
  - match: "^https?://([^/]+\\.)*cdn\\.mobilefuse\\.com/"
    location: "http://reject-img/"
  - match: "^https?://([^/]+\\.)*cdn2\\.inner-active\\.mobi/"
    location: "http://reject-img/"
  - match: "^https?://([^/]+\\.)*cdn-f\\.adsmoloco\\.com/"
    location: "http://reject-img/"
  - match: "^https?://([^/]+\\.)*impression\\.link/"
    location: "http://reject-img/"
  - match: "^https?://([^/]+\\.)*impression-asia\\.liftoff\\.io/"
    location: "http://reject-img/"
  - match: "^https?://([^/]+\\.)*wv\\.inner-active\\.mobi/"
    location: "http://reject-img/"
  - match: "^https?://([^/]+\\.)*ads\\.pubmatic\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*amazon-adsystem\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*app-analytics-services\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*appier\\.net/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*appiersig\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*ads\\.inmobi\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*bidder\\.criteo\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*config\\.inmobi\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*cr\\.adsappier\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*ets-ap-southeast-1\\.track\\.smaato\\.net/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*exchange-b-events\\.inner-active\\.mobi/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*ins\\.track\\.tappx\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*mfx\\.mobilefuse\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*sdk-dnt\\.ad\\.smaato\\.net/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*sdk-files\\.smaato\\.net/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*sdk-hb-cfg\\.smaato\\.net/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*ssp\\.api\\.tappx\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*tappx\\.com/"
    location: "http://reject-200/"
  - match: "^https?://([^/]+\\.)*view\\.adjust\\.com/"
    location: "http://reject-200/"
  - match: "^https?://alt-r\\.my\\.com/mobile"
    location: "http://reject-dict/"
  - match: "^https?://imgx\\.jampp\\.com/imgsrv/tn"
    location: "http://reject-img/"

mitm:
  hostnames:
    - "alt-r.my.com"
    - "imgx.jampp.com"
    - "*.mobilefuse.com"
    - "*.inner-active.mobi"
    - "*.adsmoloco.com"
    - "impression.link"
    - "*.liftoff.io"
    - "ads.pubmatic.com"
    - "*.amazon-adsystem.com"
    - "*.inmobi.com"
    - "*.criteo.com"
    - "*.appier.net"
    - "*.appiersig.com"
    - "app-analytics-services.com"
    - "view.adjust.com"
    - "*.smaato.net"
    - "*.tappx.com"
    - "googleads.g.doubleclick.net"
    - "pagead2.googlesyndication-cn.com"
    - "pubmatic.com"
    - "smaato.net"
    - "criteo.com"
