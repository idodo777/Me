# QQ音乐签到（Egern 版）
# 原作: MaYIHEI
# 上游来源: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/qqmusic/qqmusic.js
# 上游更新日期: 2026-10-28
# 拦截数量: 0
# 脚本数量: 4
name: QQ音乐签到
description: QQ音乐签到
author: MaYIHEI
homepage: https://github.com/MaYIHEI/paperclip
env_schema:
  GETCK:
    name: "抓取Cookie"
    description: "打开QQ音乐签到页抓Cookie，抓到后关闭；不设置时默认开启"
    default_value: "true"
    options:
    - "true"
    - "false"
  LVZ:
    name: "绿钻签到"
    description: "绿钻成长值每日签到"
    default_value: "true"
    options:
    - "true"
    - "false"
  COIN:
    name: "金币签到"
    description: "金币中心每日签到"
    default_value: "true"
    options:
    - "true"
    - "false"
  DAILY:
    name: "每日任务奖励"
    description: "领取已完成的每日任务奖励"
    default_value: "true"
    options:
    - "true"
    - "false"
  ACTIVITY:
    name: "活动任务"
    description: "金币抽奖签到、红包雨、浮动宝箱及活动任务"
    default_value: "true"
    options:
    - "true"
    - "false"
  FAVORITE:
    name: "收藏任务"
    description: "临时收藏歌曲、歌单、有声书并关注歌手"
    default_value: "true"
    options:
    - "true"
    - "false"
# 注: Egern 的 schedule 脚本只认 name/cron/script_url,不认 timeout 字段(上游 Surge/Stash 的 timeout=1200 在此无效);
# 单请求时限改由脚本桥接层默认 8 秒兜底,见 QQmusic.js 头注。cron 表达式与上游一字不差(2026-11-12 已校对)。
# 2026-11-21 v7: 「定时金币」与「红包雨」两条 schedule 已删——ACTIVITY 开关已关,这两条本就不该跑,
# 但 Egern 仍每分钟拉起脚本且偶发执行超时刷屏,脚本内早退拦不住(疑 Egern 定时任务读 env/storage 不稳定,
# 10:55 诊断读对了、10:59 同一条又超时)。删 schedule 是唯一能彻底止住刷屏的办法;每日 07:30 保留(LVZ/COIN 还开着)。
# 若以后把 ACTIVITY 重新打开,找聪明豆把这两条加回来即可。
scriptings:
- http_request:
    name: QQ音乐 Cookie
    match: '^https://u6\.y\.qq\.com/cgi-bin/musics\.fcg\?.*(EveryDaySignLvzScore|GetSignInSummary)'
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/QQmusic/QQmusic.js?v=6
    body_required: true
- schedule:
    name: QQ音乐每日任务
    cron: "30 7 * * *"
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/QQmusic/QQmusic.js?v=6
mitm:
  hostnames:
    - u6.y.qq.com
