# 腾讯视频净化（Egern 版）
# 原作: ZenmoFeiShi（TG@ZenMoFiShi）
# 上游来源: https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/TxvideoAD.snippet
# 上游更新日期: 2026-11-03
# 拦截数量: 2
# 脚本数量: 5
name: 腾讯视频净化
description: 腾讯视频去广告
author: ZenmoFeiShi
homepage: https://github.com/idodo777/Me/tree/main/TXvideo
rules:
- domain:
    match: iacc.stgw.qq.com
    policy: REJECT
- domain:
    match: tacc.video.qq.com
    policy: REJECT
scriptings:
- http_request:
    name: 腾讯视频请求净化
    match: ^https?:\/\/i\.video\.qq\.com\/(?:\?.*)?$
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/TXvideo/TXvideo.js?v=1
    body_required: true
    binary_body: true
- http_response:
    name: 腾讯视频响应净化
    match: ^https?:\/\/i\.video\.qq\.com\/(?:\?.*)?$
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/TXvideo/TXvideo.js?v=1
    body_required: true
    binary_body: true
- http_response:
    name: 腾讯视频iacc净化
    match: ^https?:\/\/iacc\.qq\.com\/(?:\?.*)?$
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/TXvideo/TXvideo.js?v=1
    body_required: true
    binary_body: true
- http_response:
    name: 腾讯视频AB配置净化
    match: ^https?:\/\/config\.ab\.qq\.com\/tab\/GetTabRemoteConfig(?:\?.*)?$
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/TXvideo/TXvideo.js?v=1
    body_required: true
    binary_body: true
- http_response:
    name: 腾讯视频rdelivery净化
    match: ^https:\/\/rdelivery\.qq\.com\/v1\/sdkconfig\/get(?:\?.*)?$
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/TXvideo/TXvideo.js?v=1
    body_required: true
mitm:
  hostnames:
  - i.video.qq.com
  - iacc.qq.com
  - config.ab.qq.com
  - rdelivery.qq.com
