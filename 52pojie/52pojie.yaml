name: 吾爱破解签到
description: 吾爱破解签到
author: ONZ3V
homepage: https://www.52pojie.cn/home.php
manual: https://www.52pojie.cn/home.php
icon: https://raw.githubusercontent.com/Yuheng0101/X/main/Assets/52pojie.png
compat_arguments:
  GETCK: "true"
compat_arguments_schema:
  GETCK:
    name: "抓取Cookie"
    description: "打开后点上方主页登录吾爱破解并刷新页面，抓到Cookie后请关闭此开关"
    default_value: "true"
    options:
    - "true"
    - "false"
scriptings:
- http_request:
    name: 吾爱破解获取Cookie
    match: '^https://www\.52pojie\.cn/home\.php\?'
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/52pojie/ck_{{{GETCK}}}.js?v=1
- schedule:
    name: 吾爱破解签到
    cron: "30 10 * * *"
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/52pojie/52pojie.js?v=1
mitm:
  hostnames:
    - www.52pojie.cn
