# 上游来源: https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/MT.snippet
# 上游更新日期: 2026-10-25
# 拦截数量: 0
# 脚本数量: 8
# 注: 上游的 HTTPDNS 封杀组（httpdns/dnspod 域名 6 条 + IP 29 条 + IPv6 4 条，共 39 条）未收录——
#     该组在 Egern + 当前美团版本下会让 App 无可用解析路径、整页「无法连接网络」，2026-11-11 真机实测后移除。
#     上游两条 url reject 亦属该组（httpdns 域名组、103.37.155.60/fetch），一并去除。
# v3（2026-11-11）: 定位版——规则全部撤下（shark 6 条 + mquic wildcard 1 条），只保留 8 条脚本，
#     用于确认真机「网络异常」是否由规则层引起；网络恢复后再逐条加回定位。
name: 美团净化
description: 美团去广告
author: ZenmoFeiShi
homepage: https://github.com/idodo777/Me/tree/main/MT
scriptings:
- http_response:
    name: 美团首页Tab净化
    match: ^https?:\\/\\/apimobile\\.meituan\\.com\\/aggroup\\/indexTab
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
- http_response:
    name: 美团信息流净化
    match: ^https?:\\/\\/feedguess\\.meituan\\.com\\/lycoris\\/scene\\/(gwc_feed1_2265|personalcenter_2154)(\\?|$)
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
- http_response:
    name: 美团个人中心净化
    match: ^https?:\\/\\/mt-personalcenter\\.meituan\\.com\\/usercenter\\/display
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
- http_response:
    name: 美团搜索默认词净化
    match: ^https?:\\/\\/apimobile\\.meituan\\.com\\/group\\/v1\\/deal\\/searchpage\\/defaultword
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
- http_response:
    name: 美团搜索热词净化
    match: ^https?:\\/\\/apimobile\\.meituan\\.com\\/group\\/v1\\/deal\\/searchpage\\/hotword\\/city\\/divide\\/hotrecommend\\/
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
- http_response:
    name: 美团小喇叭配置净化
    match: ^https?:\\/\\/assistify\\.meituan\\.com\\/assistant\\/getAppClientHornConfig
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
- http_response:
    name: 美团购物车入口净化
    match: ^https?:\\/\\/mop\\.meituan\\.com\\/mop\\/entry\\/shoppingCartEntry
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
- http_response:
    name: 美团开屏图净化
    match: ^https?:\\/\\/mop\\.meituan\\.com\\/api\\/entryModule\\/startupPicture
    script_url: https://raw.githubusercontent.com/idodo777/Me/main/MT/MT.js?v=1
    body_required: true
mitm:
  hostnames:
  - apimobile.meituan.com
  - feedguess.meituan.com
  - mop.meituan.com
  - mt-personalcenter.meituan.com
  - assistify.meituan.com
