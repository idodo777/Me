name: "节点阻断检测"
description: "节点阻断检测"
author: "idodo777"
homepage: "https://github.com/idodo777/Me"
compat_arguments:
  POLICY: ""
  HOST: ""
  PORT: ""
  NAME: ""
compat_arguments_schema:
  POLICY:
    name: "节点名称"
    description: "要检测的节点或策略组名称，须与 Egern 配置中的名称完全一致"
    default_value: ""
  HOST:
    name: "服务器地址"
    description: "节点的服务器域名或 IP，例如 hk01.example.com"
    default_value: ""
  PORT:
    name: "服务器端口"
    description: "节点的端口号，例如 443"
    default_value: ""
  NAME:
    name: "显示名称（可选）"
    description: "检测结果里显示的名字，不填则使用节点名称"
    default_value: ""

scriptings:
  - generic:
      name: "节点阻断检测"
      script_url: "https://raw.githubusercontent.com/idodo777/Me/main/blockcheck/block_check_egern.js"
      env:
        POLICY: "{{{POLICY}}}"
        HOST: "{{{HOST}}}"
        PORT: "{{{PORT}}}"
        NAME: "{{{NAME}}}"
      timeout: 60
