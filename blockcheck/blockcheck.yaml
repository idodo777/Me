description: "节点阻断检测"
author: "idodo777"
homepage: "https://github.com/idodo777/Me"

env_schema:
  POLICY:
    name: "检测策略"
    description: "检测哪个策略组或节点的连通性（如 Proxy、香港）；留空按 Egern 分流规则（兜底策略）"

scriptings:
  - generic:
      name: "block-check"
      script_url: "https://raw.githubusercontent.com/idodo777/Me/main/blockcheck/block_check_egern.js?v=60"
      update_interval: 300
      timeout: 30

widgets:
  - name: "节点阻断检测"
    script_name: "block-check"
