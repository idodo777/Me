body_rewrites:
- response_jq:
    match: '^https?://api\.pinduoduo\.com/api/alexa/homepage/hub(?:\?|$)'
    filter: 'if (.result | type) == "object" then delpaths([["result","dy_module","irregular_banner_dy"],["result","icon_set"],["result","search_bar_hot_query"],["result","home_screen_skin"]]) | .result |= (if (.bottom_tabs | type) == "array" then .bottom_tabs |= map(select(.link | IN("index.html", "chat_list.html", "personal.html"))) else . end) | .result |= (if (.buffer_bottom_tabs | type) == "array" then .buffer_bottom_tabs |= map(select(.link | IN("index.html", "chat_list.html", "personal.html"))) else . end) | .result |= (if (.selected_bottom_skin | type) == "object" then .selected_bottom_skin |= with_entries(select((.key != "9") and (.key != "14"))) else . end) | .result |= (if (.all_top_opts | type) == "array" then .all_top_opts |= (map(select((.tab_id == 1) or (.tab_id == 2) or (.tab_id == "1") or (.tab_id == "2"))) | map(del(.selected_image, .image, .height, .width))) else . end) | .result |= (if (.module_order | type) == "array" then .module_order |= map(select(.module_name != "community_goods")) else . end) else . end'
- response_jq:
    match: '^https?://api\.pinduoduo\.com/search(?:\?|$)'
    filter: 'delpaths([["expansion"]])'
- response_jq:
    match: '^https?://api\.pinduoduo\.com/api/philo/personal/hub(?:\?|$)'
    filter: 'delpaths([["monthly_card_entrance"],["personal_center_style_v2_vo"],["icon_set","icons"],["icon_set","top_personal_icons"],["personal_banner"],["wallet","entrance_text"]])'
- response_jq:
    match: '^https?://api\.pinduoduo\.com/api/oak/integration/render(?:\?|$)'
    filter: 'delpaths([["bottom_section_list"],["ui","bottom_section"],["ui","live_section","float_info"]])'
- response_jq:
    match: '^https?://api\.pinduoduo\.com/api/caterham/v3/query/order_detail_group(?:\?|$)'
    filter: 'delpaths([["data","goods_list"]])'
- response_jq:
    match: '^https?://api\.pinduoduo\.com/order/'
    filter: 'delpaths([["marketing_banner_vo"],["shipping","banner_above_recommend"]])'
- response_jq:
    match: '^https?://api\.pinduoduo\.com/api/aristotle/order_list_v4(?:\?|$)'
    filter: 'if (.orders | type) == "array" then .orders |= map(if (.order_buttons | type) == "array" then .order_buttons |= map(del(.order_growth_tip)) else . end) else . end'
- response_jq:
    match: '^https?://api\.pinduoduo\.com/api/social/timeline/v4/get/entrance(?:\?|$)'
    filter: '(if (.entrance | type) == "object" then .entrance.status = 0 | .entrance.content = [] else . end) | del(.entrance_icon_image)'
