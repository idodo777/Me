# 京东京粉（Egern 版）
# 京东 wskey 同步：参照 githubdulong/Script JDWSKey.js 改写，抓到即 POST 到服务器，自动写青龙 JD_WSCK 并触发转换
#   触发（2026-11-27 HAR 实锤改宽）：京东 App 16.1.90 不调 newUserInfo，改盯 api.m.jd.com 全站，
#   请求 Cookie 里有 wskey 即抓；pin 从响应体取（userInfoSns / "pin":"xxx" / $pin=xxx）
#   上游 boxjs 说明：上游 jfCookie 与 TG 配置均为 BoxJS 里用户手填，不靠实时请求抓 Cookie；
#   本模块 wskey 走实时请求 Cookie（HAR 证实 11/20 个首页请求都带 wskey），转链 Cookie 默认同理，
#   转链失败再填模块参数 JD_COOKIE（青龙 JD_COOKIE 的完整 pt_key 值）
# 京粉转链：上游作者 Tartarus2014（脚本）/ sempliciy（Surge 模块），上游更新：脚本 2021-11-03；模块 2022-06-08
# 拦截数量：2（api.m.jd.com、api-dd.jd.com）
# 脚本数量：2（jd-wskey.js 京东 wskey 同步 + jdjf.js 一键转京粉返利链接，合并上游 jdjf_price.js 与 jf_Convert.js）
# 上游来源：https://github.com/sempliciy/Quantumult-X/blob/master/Surge/JD_Pirce.sgmodule
# 脚本来源：https://github.com/Tartarus2014/Script/blob/master/jdjf_price.js
#          https://github.com/Tartarus2014/Script/blob/master/jf_Convert.js
#          https://github.com/githubdulong/Script/blob/master/Surge/JDWSKey.sgmodule
# 注意：同步服务器地址与口令不在本文件里，由用户在模块设置页填写（CK_SYNC_URL / CK_SYNC_TOKEN）
name: 京东京粉
description: 京东 wskey 同步青龙 · 商品一键转京粉返利链接 0.5
author: Tartarus2014
homepage: https://github.com/sempliciy/Quantumult-X/blob/master/Surge/JD_Pirce.sgmodule
env_schema:
  JDWSKEY:
    name: "京东 wskey 同步"
    description: "打开京东 App 即抓 wskey，自动同步到青龙"
    default_value: "false"
    options:
      - "true"
      - "false"
  CK_SYNC_URL:
    name: "同步服务器地址"
    description: "CK 接收器地址，在模块设置里填"
    default_value: ""
  CK_SYNC_TOKEN:
    name: "同步口令"
    description: "服务器 /opt/ck-sync/token 里的口令，填一次即可"
    default_value: ""
  JF_CONVERT:
    name: "京粉转链"
    description: "打开商品自动转京粉返利链接，点通知一键跳转"
    default_value: "true"
    options:
      - "true"
      - "false"
  JF_PRICE:
    name: "历史比价"
    description: "通知里附带历史最低价"
    default_value: "true"
    options:
      - "true"
      - "false"
  JD_COOKIE:
    name: "京粉 Cookie"
    description: "留空用京东 App 请求自带的 Cookie；转链失败再填京粉账号的 Cookie"
    default_value: ""
scriptings:
  - http_response:
      name: 京东 wskey 同步
      match: '^https://(api\.m\.jd\.com|api-dd\.jd\.com)/'
      script_url: https://raw.githubusercontent.com/idodo777/Me/main/JDjf/jd-wskey.js?v=3
      body_required: true
  - http_response:
      name: 京粉转链
      match: '^https?://api\.m\.jd\.com/(client\.action|api)\?functionId=(wareBusiness|serverConfig|basicConfig|lite_wareBusiness|pingou_item)'
      script_url: https://raw.githubusercontent.com/idodo777/Me/main/JDjf/jdjf.js?v=2
      body_required: true
      timeout: 30
      max_size: 2097152
mitm:
  hostnames:
    - api.m.jd.com
    - api-dd.jd.com
